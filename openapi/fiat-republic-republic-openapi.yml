openapi: 3.1.0
info:
  title: fiat-republic
  version: '1.0'
servers:
- url: https://sandbox.fiatrepublic.com/api/v1
security:
- sec0: []
x-readme-fauxas: true
paths:
  /conversions:
    post:
      summary: Create Conversion
      description: ''
      operationId: create-conversion
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - quoteId
              - fromId
              - toId
              properties:
                quoteId:
                  type: string
                  description: Id of the Quote from the Create Quote endpoint for which you want to create a conversion.
                fromId:
                  type: string
                  description: Id of the Fiat Account from which you want the Sell amount to be debited.
                toId:
                  type: string
                  description: Id of the Fiat Account into which you want the Buy amount to be credited.
                reference:
                  type: string
                  description: Optional internal reference for the conversion.
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n   \"id\":\"con_2pjbyge1ln0d9z8klm\",\n   \"fromId\":\"fac_j82rl497g6k1g5ykvz\",\n   \"toId\":\"fac_rp9mnzv0pgl0ya85ox\",\n   \"sellCurrency\":\"GBP\",\n   \"buyCurrency\":\"EUR\",\n   \"sellAmount\":\"840\",\n   \"buyAmount\":\"1000\",\n   \"rate\":\"0.84000\",\n   \"reference\":\"Liquidity purchase\",\n   \"status\":\"CREATED\",\n   \"createdAt\":1663685590420,\n   \"updatedAt\":1663685596383\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: con_2pjbyge1ln0d9z8klm
                  fromId:
                    type: string
                    example: fac_j82rl497g6k1g5ykvz
                  toId:
                    type: string
                    example: fac_rp9mnzv0pgl0ya85ox
                  sellCurrency:
                    type: string
                    example: GBP
                  buyCurrency:
                    type: string
                    example: EUR
                  sellAmount:
                    type: string
                    example: '840'
                  buyAmount:
                    type: string
                    example: '1000'
                  rate:
                    type: string
                    example: '0.84000'
                  reference:
                    type: string
                    example: Liquidity purchase
                  status:
                    type: string
                    example: CREATED
                  createdAt:
                    type: integer
                    example: 1663685590420
                    default: 0
                  updatedAt:
                    type: integer
                    example: 1663685596383
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request POST \\\n     --url https://sandbox.fiatrepublic.com/api/v1/conversions \\\n     --header 'Accept: application/json' \\\n     --header 'Authorization: Bearer ZmlhdHJlcHVibGljOmZpYXRyZXB1YmxpYw==' \\\n     --header 'Content-Type: application/json' \\\n     --data '\n{\n    \"quoteId\": \"qot_grbvdy1vxnd0z54n6m\",\n    \"fromId\": \"fac_legpmn06ep27ry2bvo\",\n    \"toId\": \"fac_eaxp4n74jmv7l58vmy\"\n}\n'"
        samples-languages:
        - curl
    get:
      summary: List Conversions
      description: ''
      operationId: list-conversions
      parameters:
      - name: buyAmount(gte)
        in: query
        description: Greater than or equal to the buy amount of the conversion.
        schema:
          type: string
      - name: buyAmount(lte)
        in: query
        description: Less than or equal to the buy amount of the conversion.
        schema:
          type: string
      - name: buyCurrency
        in: query
        description: 3 letter [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code. Accepts multiple codes.
        schema:
          type: string
          enum:
          - ''
      - name: createdAt(gte)
        in: query
        description: Greater than or equal to the created date. [ISO 8601 Date](https://en.wikipedia.org/wiki/ISO_8601) format. e.g. `2021-11-18`
        schema:
          type: string
      - name: createdAt(lte)
        in: query
        description: Less than or equal to the created date. [ISO 8601 Date](https://en.wikipedia.org/wiki/ISO_8601) format. e.g. `2021-11-18`
        schema:
          type: string
      - name: fromId
        in: query
        description: Id of the sell side Fiat Account. Accepts multiple id's.
        schema:
          type: string
      - name: id
        in: query
        description: Id of the conversion. Accepts multiple id's.
        schema:
          type: string
      - name: search
        in: query
        description: Search by the Conversion id or reference.
        schema:
          type: string
      - name: sellAmount(gte)
        in: query
        description: Greater than or equal to the sell amount of the conversion.
        schema:
          type: string
      - name: sellAmount(lte)
        in: query
        description: Less than or equal to the sell amount of the conversion.
        schema:
          type: string
      - name: sellCurrency
        in: query
        description: 3 letter [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code. Accepts multiple codes.
        schema:
          type: string
          enum:
          - ''
      - name: status
        in: query
        description: Status of the conversion. Accepts multiple statuses.
        schema:
          type: string
          enum:
          - CREATED
          - PROCESSING
          - COMPLETED
      - name: toId
        in: query
        description: Id of the buy side Fiat Account. Accepts multiple id's.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n   \"id\":\"con_2pjbyge1ln0d9z8klm\",\n   \"fromId\":\"fac_j82rl497g6k1g5ykvz\",\n   \"toId\":\"fac_rp9mnzv0pgl0ya85ox\",\n   \"sellCurrency\":\"GBP\",\n   \"buyCurrency\":\"EUR\",\n   \"sellAmount\":\"840\",\n   \"buyAmount\":\"1000\",\n   \"rate\":\"0.84000\",\n   \"reference\":\"Liquidity purchase\",\n   \"status\":\"COMPLETED\",\n   \"createdAt\":1663685590420,\n   \"updatedAt\":1663685596500\n  },\n  {...},\n  {...}\n]\n"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request GET \\\n     --url https://sandbox.fiatrepublic.com/api/v1/conversions \\\n     --header 'Accept: application/json' \n     --header 'Authorization: Basic ZmlhdHJlcHVibGljOmZpYXRyZXB1YmxpYw==' \\"
        samples-languages:
        - curl
  /conversions/{id}:
    get:
      summary: Get Conversion
      description: ''
      operationId: get-conversion
      parameters:
      - name: id
        in: path
        description: Id of the conversion.
        schema:
          type: string
        required: true
      responses:
        '200':
