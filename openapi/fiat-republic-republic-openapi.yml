  /end-users/businesses:
    post:
      summary: Create Business End User
      description: ''
      operationId: create-business-end-user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - businessPersons
              - ipAddress
              - sector
              properties:
                business:
                  type: object
                  required:
                  - companyName
                  - tradingName
                  - type
                  - registrationNumber
                  - registrationDate
                  properties:
                    companyName:
                      type: string
                      description: 'Cannot contain any of these special chars: **\<!&|$\*;^%\_>#@="~   {}\\**'
                    tradingName:
                      type: string
                    type:
                      type: string
                      enum:
                      - LIMITED
                    registrationNumber:
                      type: string
                    registrationDate:
                      type: string
                      format: date
                    registeredAddress:
                      type: object
                      required:
                      - line 1
                      - city
                      - postal code
                      - country
                      properties:
                        line 1:
                          type: string
                          description: First line of the company registration address
                        line 2:
                          type: string
                          description: Second line of the company registration address
                        city:
                          type: string
                          description: City of the registration address
                        state:
                          type: string
                          description: Required for entity with address in CA and US
                        postal code:
                          type: string
                          description: Postal code of the registration address
                        country:
                          type: string
                          description: Country code of the registration address
                    tradingAddress:
                      type: object
                      required:
                      - line1
                      - city
                      - postalCode
                      - country
                      properties:
                        line1:
                          type: string
                          description: First line of the company trading address
                        line2:
                          type: string
                          description: Second line of the company trading address
                        city:
                          type: string
                          description: City of the trading address
                        state:
                          type: string
                          description: State or region of the trading address
                        postalCode:
                          type: string
                          description: Postal code of the trading address
                        country:
                          type: string
                          description: Two-letter ISO 3166-1 alpha-2 country code e.g. GB for United Kingdom
                    website:
                      type: string
                    phone:
                      type: string
                      description: Phone number of the Individual including country prefix. e.g. +447788661100
                businessPersons:
                  type: array
                  items:
                    properties:
                      person:
                        type: object
                        required:
                        - dob
                        - email
                        - firstName
                        - lastName
                        properties:
                          address:
                            type: object
                            description: Home Address of the Individual. Is required
                            required:
                            - line1
                            - city
                            - postalCode
                            - country
                            properties:
                              line1:
                                type: string
                              line2:
                                type: string
                              city:
                                type: string
                              state:
                                type: string
                                description: Required for entity with address in CA and US
                              postalCode:
                                type: string
                              country:
                                type: string
                                description: Two-letter [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code e.g. `GB` for United Kingdom
                          birthCountry:
                            type: string
                            description: Two-letter [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code e.g. `GB` for United Kingdom
                          dob:
                            type: string
                            description: Date of Birth of the Individual in `YYYY-MM-DD` format. e.g. `1975-04-05`
                            format: date
                          email:
                            type: string
                            description: Email of the Individual.
                          firstName:
                            type: string
                            description: First Name of the Individual.
                          middleName:
                            type: string
                            description: Middle Name(s) of the Individual.
                          lastName:
                            type: string
                            description: Last Name of the Individual.
                          nationality:
                            type: array
                            description: Two-letter [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code e.g. `GB` for United Kingdom. One of more nationalities can be provided. Required for USD.
                            items:
                              type: string
                          phone:
                            type: string
                            description: Phone number of the Individual including country prefix. e.g. `+447788661100` Required for USD
                          identificationDocument:
                            type: object
                            description: Required for USD
                            properties:
                              number:
                                type: string
                              type:
                                type: string
                                description: Type of identity document
                                enum:
                                - WORK_PERMIT
                                - PASSPORT
                                - NATIONAL_ID
                                - DRIVERS_LICENCE
                      types:
                        type: array
                        description: Type of the Business Person. Can be CONTACT, DIRECTOR or UBO. Multiple choice field
                        default: []
                        items:
                          type: string
                      ownership:
                        type: string
                        description: Amount of shares hold by the Business Person (in %)
                    type: object
                ipAddress:
                  type: string
                  description: The IP address from where the individual signed up on your platform.
                linkedCryptoWallets:
                  type: string
                  description: Details of any known crypto wallets linked with the individual being created.
                tags:
                  type: string
                  description: Tags allowing you to provide additional risk-related information for the business.
                sector:
                  type: string
                  description: Sector in which business operates
                  enum:
                  - OTHER_PRODUCTS_SERVICES
                  - BLOCKCHAIN
                  - LICENSED_ALCOHOL_SERVICES
                  - LEGAL_SERVICES
                  - LICENSED_PHARMACEUTICALS
                  - LICENSED_TELECOM_SERVICES
                  - MEDICAL_SERVICES
                  - PRECIOUS_METALS_DEALERS
                  - TRAVEL_SERVICES
                  - TRUST
                  - SCRAPYARD_DEALERS
                  - REGULATED_FINANCIAL_SERVICES
                  - MONEY_TRANSMISSION_SERVICES
                  - DOWNSTREAM_SERVICES_TO_OTHER_PSP
                  - DONATIONS_CHARITABLE_ORGANISATIONS
                  - ADULT_CONTENT
                  - BAIL_BONDSMAN_BAILIFF_SERVICES
                  - BINARY_OPTIONS
                  - CASH_LIKE_PRODUCTS
                  - CBD_MARIJUANA
                  - COPYRIGHT_MEDIA_AND_SOFTWARE
                  - COUNTERFEIT_GOODS
                  - UNREGULATED_CRYPTO_BUSINESS
                  - DRUG_RELATED_ACCESSORIES
                  - ESCORT_PROSTITUTES_AGENCY
                  - TAROT_HOROSCOPE_READERS
                  - GAMBLING_CASINOS
                  - PONZI_SCHEME_UNREGULATED_INVESTMENT
                  - GOVERNMENTID_DOCUMENT_UNIFORMS
                  - HUMAN_BODY_PARTS
                  - ILLEGAL_TELECOMMUNICATION_DEVICES
                  - ILLEGAL_UNSAFE_PRODUCTS
                  - NUTRACEUTICALS
                  - OFFENSIVE_GOODS_RELATED_TO_CRIME
                  - PAY_DAY_LENDERS
                  - PYROTECHNIC_HAZARDOUS_MATERIALS
                  - UNREGULATED_FINANCIAL_SERVICES
                  - FIREARMS_WEAPONS_MILITARY_SOFTWARE_TECHNOLOGY
                  - SKINS_LOOT_BOX_TRADING
                  - TIMESHARE
                  - ELECTRONIC_DATA_SOLUTION
                  - HUMAN_CLONING_REPRODUCTION
                  - OUTBOUND_TELEMARKETING
                  - CHEMICALS
                  - WHOLESALE_TO_CASH_BASED_REMITTANCE
                  - ART_MARKET_PARTICIPANT
                  - CRYPTO
                  - TICKET_BROKER
                  - NON_LICENSED_COUNSELLING
                  - TOBACCO_ECIGARETTES
                  - UNLICENSED_LAWYERS_LEGAL_SERVICES
                  - UNLICENSED_LIQUOR_SALES
                  - UNLICENSED_PHARMACEUTICALS
                  - GOVERNMENTAL_LICENSED_WITHOUT_THE_LICENCE
                  - PYRAMID_SCHEME_MLM
                riskRating:
                  type: string
                  description: Rating of the risk level assigned to the business
                  enum:
                  - LOW
                  - MEDIUM
                  - HIGH
                signupAt:
                  type: integer
                  description: A date of registration of End User profile within Member platform
                  format: int32
                metadata:
                  type: array
                  items:
                    type: string
                annualTurnoverRange:
                  type: string
                  description: Value of annual turnover range of the Business End User (in EUR)
                  enum:
                  - RANGE_0_TO_50000
                  - RANGE_50000_TO_250000
                  - RANGE_250000_TO_1000000
                  - RANGE_1000000_TO_5000000
                  - ABOVE_5000000
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value:
                    id: eus_eaxp4n74jm827lzzz
                    business:
                      id: biz_v8jkx67nd5bg1zzz
                      companyName: Conn LLC
                      tradingName: null
                      type: LIMITED
                      registrationNumber: OWvVE1
                      registrationDate: '2010-11-21'
                      registeredAddress:
                        line1: 24913 Frami Motorway
                        line2: null
