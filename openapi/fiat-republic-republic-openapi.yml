                  owner:
                    type: object
                    properties:
                      type:
                        type: string
                        example: MEMBER
                      id:
                        type: string
                        example: mbr_d8ovyep1r8x0kx65n2
                  name:
                    type: string
                    example: OnlyBulls
                  walletDetails:
                    type: object
                    properties:
