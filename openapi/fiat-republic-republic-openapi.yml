              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: con_2pjbyge1ln0d9z8klm
                  fromId:
                    type: string
                    example: fac_j82rl497g6k1g5ykvz
                  toId:
                    type: string
                    example: fac_rp9mnzv0pgl0ya85ox
                  sellCurrency:
                    type: string
                    example: GBP
                  buyCurrency:
                    type: string
