                  status:
                    type: string
                    example: COMPLETED
                  createdAt:
                    type: integer
                    example: 1663685590420
                    default: 0
                  updatedAt:
                    type: integer
                    example: 1663685596500
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request GET \\\n     --url https://sandbox.fiatrepublic.com/api/v1/conversions/con_2pjbyge1ln0d9z8klm \\\n     --header 'Accept: application/json' \n     --header 'Authorization: Basic ZmlhdHJlcHVibGljOmZpYXRyZXB1YmxpYw==' \\\n"
        samples-languages:
        - curl
  /documents:
    post:
      summary: Create Document
      description: ''
      operationId: create-document
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: 'Allowed formats: JSON, JPEG, PDF, PNG'
                  format: binary
                metadata:
                  type: object
                  properties:
                    description:
                      type: string
                    type:
                      type: string
                      description: To enable USD, please choose IDENTITY_VERIFICATION
                      enum:
                      - IDENTITY_VERIFICATION
                      - PASSPORT
                      - CERTIFICATE_OF_INCORPORATION
                    relatedEntityIds:
                      type: array
                      description: IDs of related End User or Business object
                      items:
                        type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"doc_ov8jkx67ny1dbzzzzz\",\n    \"type\": \"IDENTITY_VERIFICATION\",\n    \"description\": \"LedgerPlus UBO IV\",\n    \"relatedEntityIds\": [\n        \"eus_p9mnzv0pkozxxxxxxx\"\n    ],\n    \"format\": \"PDF\",\n    \"originalName\": \"Passport_Page.pdf\",\n    \"createdAt\": 1747827809851\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: doc_ov8jkx67ny1dbzzzzz
                  type:
                    type: string
                    example: IDENTITY_VERIFICATION
                  description:
                    type: string
                    example: LedgerPlus UBO IV
                  relatedEntityIds:
                    type: array
                    items:
                      type: string
                      example: eus_p9mnzv0pkozxxxxxxx
                  format:
                    type: string
                    example: PDF
                  originalName:
                    type: string
                    example: Passport_Page.pdf
                  createdAt:
                    type: integer
                    example: 1747827809851
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      x-readme:
        code-samples:
        - code: "curl --request POST \\\n  --url https://sandbox.fiatrepublic.com/api/v1/documents \\\n  --header 'accept: application/json' \\\n  --form 'file=@your_document_name.pdf;type=application/pdf' \\\n  --form 'metadata={\n    \"documentType\": \"KYC\",\n    \"memberId\": \"123456\"\n  };type=application/json'\n"
          language: json
          name: ''
        samples-languages:
        - json
    get:
      summary: Get Document
      description: ''
      operationId: get-documents
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: ID of the document
                relatedEntityId:
                  type: string
                  description: IDs of related End User or Business object
                format:
                  type: string
                  description: JSON, JPEG, PDF, PNG
                search:
                  type: string
                limit:
                  type: string
                offset:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
