                  value: "{\n    \"errorCode\": \"INVALID_REQUEST_DATA\",\n    \"message\": \"'epy_jalpeo0evbg7bkx39' is not a valid identifier.\"\n}"
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                    example: INVALID_REQUEST_DATA
                  message:
                    type: string
                    example: '''epy_jalpeo0evbg7bkx39'' is not a valid identifier.'
      deprecated: false
