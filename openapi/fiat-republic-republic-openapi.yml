                    type: string
                    example: epy_jalpeo0evbg7bkx39zzzz
                  owner:
                    type: object
                    properties:
                      type:
                        type: string
                        example: MEMBER
                      id:
                        type: string
                        example: mbr_d8ovyep1r8x0kx65zz2
                  name:
                    type: string
                    example: 'Norse Wallet CORP '
                  status:
                    type: string
                    example: ACTIVE
                  token:
                    type: string
                    example: ENEUR
                  walletDetails:
                    type: object
                    properties:
                      token:
                        type: string
                        example: EEUR
                      address:
                        type: string
                        example: XXXXXYYYYYYZZZZZZAAAAABBBBBBBBCCCCCCCCCCDDDDDDDDD
                      blockchain:
                        type: string
                        example: ALGO
                  paymentSchemes:
                    type: array
                    items:
                      type: string
