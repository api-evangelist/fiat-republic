      description: ''
      operationId: update-document
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                relatedEntityIds:
                  type: array
                  description: Provide the End User ID(s) or Business ID(s) to link this document to the relevant entity
                  items:
                    type: string
      responses:
