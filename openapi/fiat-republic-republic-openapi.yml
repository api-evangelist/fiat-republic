  /payees:
    post:
      summary: Create Payee
      description: ''
      operationId: create-payee
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - address
              - bankDetails
              - currency
              - name
              - type
              properties:
                additionalDetails:
                  type: object
                  properties:
                    DOB:
                      type: string
                      description: Date of Birth of the Payee in `YYYY-MM-DD` format. e.g. `1975-04-05`.
                      format: date
                address:
                  type: object
                  description: Address of the Payee as provided on the bank account. Starting from April 7th, once creating Payee the address object will be required
                  required:
                  - line1
                  - city
                  - postalCode
                  - country
                  properties:
                    line1:
                      type: string
                    line2:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                      description: Required for Payees with address in CA and US
                    postalCode:
                      type: string
                    country:
                      type: string
                      description: Two-letter [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code e.g. `GB` for United Kingdom
                bankDetails:
                  type: object
                  description: Bank details of the Payee. The required fields depend on the currency.
                  properties:
                    accountNumber:
                      type: string
                    bic:
                      type: string
                    iban:
                      type: string
                    routingCodes:
                      type: array
                      description: List of routing codes.
                      items:
                        properties:
                          type:
                            type: string
                            description: Type of the routing code. Either ABA, SORT_CODE, WIRE or BSB
                            default: ''
                          value:
                            type: string
                            description: Value of the routing code.
                        type: object
                        required:
                        - value
                        - type
                currency:
                  type: string
                  description: 3 letter [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) code of the currency in which the Payee's bank account is held.
                  enum:
                  - ''
                endUserId:
                  type: string
                  description: Id of the End User for who you want to create the Payee.<br>If not set, the Payee will be created for the Member.
                name:
                  type: string
                  description: Full name of the Payee.
                type:
                  type: string
                  enum:
                  - PERSON
                  - BUSINESS
                metadata:
                  type: array
                  items:
                    type: string
            examples:
              USD example:
                value:
                  endUserId: eus_zvyb8r19d9v7xxxxxo
                  type: PERSON
                  name: Cathrine Jacobs
                  currency: USD
                  address:
                    line1: 4140 Roberto Lane
                    line2: null
                    city: Lake Icieburgh
                    state: Newfoundland
                    postalCode: 03872
                    country: CA
                  bankDetails:
                    accountHolderName: Cathrine Jacobs
                    bankName: FIRSTRAND BANK LIMITED
                    bankAddressLine1: MERCHANT PLACE 4 CORNER FREDMAN, DRIVE AND RIVONIA R SANDTON
                    bankAddressCity: JOHANNESBURG
                    bankAddressPostalCode: '2196'
                    bankAddressCountry: ZA
                    accountNumber: '62405320227'
                    bic: FIRNZAJJ
                    routingCodes:
                    - value: '022000020'
                      type: ABA
                    intermediaryBicSwift: HBUKGB4B
                    intermediaryBankAddressLine1: 1 CENTENARY SQUARE
                    intermediaryBankAddressCity: BIRMINGHAM
                    intermediaryBankAddressPostalCode: B1 1HQ
                    intermediaryBankAddressCountry: GB
                    intermediaryBankName: HSBC UK BANK PLC
                  additionalDetails: null
                  metadata: null
              EUR example:
                value:
                  type: PERSON
                  name: Gillian Parsons
                  currency: EUR
                  address:
                    line1: Jalonkatu 57
                    line2: null
                    city: Oulu
                    state: null
                    postalCode: '90310'
                    country: FI
                  bankDetails:
                    accountHolderName: Gillian Parsons
                    iban: DE65250500000002523058
                  metadata: null
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n   \"id\":\"pye_ejl2vpn1md315rxko6\",\n   \"owner\":{\n      \"type\":\"MEMBER\",\n      \"id\":\"mbr_ejl2vpn1m305rxko6b\"\n   },\n   \"type\":\"PERSON\",\n   \"name\":\"Satoshi Nakamoto\",\n   \"currency\":\"GBP\",\n   \"address\": {\n      \"line1\": \"North Brittanyview 00807\",\n      \"line2\": null,\n      \"city\": \"New Michael\",\n      \"state\": null,\n      \"postalCode\": \"L5J 0PJ\",\n      \"country\": \"GB\"\n    },\n   \"paymentSchemes\":[\n      \"FPS\",\n      \"CHAPS\"\n   ],\n   \"bankDetails\": {\n        \"routingCodes\":[\n        {\n         \"value\":\"000000\",\n         \"type\":\"SORT_CODE\"\n        }\n       ]\n        \"accountNumber\": \"12341234\"\n    },\n   \"additionalDetails\":{\n      \"dob\":\"1975-04-05\"\n   },\n   \"createdAt\":1637132469304,\n   \"updatedAt\":1637132469304,\n   \"metadata\":null,\n   \"status\":\"CREATED\"\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errorCode\": \"INVALID_REQUEST_DATA\",\n  \"message\": \"Invalid Payee input data.\",\n  \"warnings\": [\n    {\n      \"position\": \"bankDetails\",\n      \"issue\": \"USD account details with an 'accountNumber` should contain 'bic' + 'bankAddressCountry' for (SWIFT countries not supporting IBANs), or 'bic' + 'routingCodes' (ABA or WIRE).\"\n    },\n    {\n      \"position\": \"bankDetails.routingCodes[0].value\",\n      \"issue\": \"The value of 'ABA' should have exactly 9 characters.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                    example: INVALID_REQUEST_DATA
                  message:
                    type: string
                    example: Invalid Payee input data.
                  warnings:
                    type: array
                    items:
                      type: object
                      properties:
                        position:
                          type: string
                          example: bankDetails
                        issue:
                          type: string
                          example: USD account details with an 'accountNumber` should contain 'bic' + 'bankAddressCountry' for (SWIFT countries not supporting IBANs), or 'bic' + 'routingCodes' (ABA or WIRE).
      deprecated: false
