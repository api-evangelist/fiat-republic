info:
  title: fiat-republic Payment Returns API
  version: '1.0'
servers:
- url: https://sandbox.fiatrepublic.com/api/v1
security:
- sec0: []
tags:
- name: Payment Returns
paths:
  /payment-returns:
    post:
      summary: Create Return
      description: ''
      operationId: create-return
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - paymentId
              - reason
              properties:
                paymentId:
                  type: string
                  description: Id of the Payment (Payins only) that you want to return.
                reason:
                  type: string
                  description: Internal reason for you to capture why the payment is being returned.
                returnDetails:
                  type: object
                  description: Providing only the `paymentId` in this request will automatically return the Payment to the sender. To return the payment to another payee, you can provide details in this object.
                  properties:
                    payeeId:
                      type: string
                      description: Id of an existing Payee (other than the sender) to who you want to return the payment.
                    paymentScheme:
                      type: string
                      description: Payment Scheme to use for the return if you want to return the payment via a scheme that is different to the scheme via which it was received.
                      enum:
                      - FPS
                      - CHAPS
                      - SCT
                    reference:
                      type: string
                      description: Alternative reference to use for the Return. If not provided, the original reference on the Payin will be used prefixed with `RET`
            examples:
              Return to Sender:
                value:
                  paymentId: pmt_xpn6le15na21v9jo4g
                  reason: 3rd party payment
              Return to different Payee:
                value:
                  paymentId: pmt_blpd5j1a5bm7meya4r
                  reason: returnReason
                  returnDetails:
                    payeeId: pye_mv4j2318rjo7oaz56y
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n   \"id\":\"rtn_j82rl497g47g5ykvzn\",\n   \"memberId\":\"mbr_emv4j231821oaz56yx\",\n   \"status\":\"CREATED\",\n   \"paymentId\":\"pmt_xpn6le15nyk1v9jo4g\",\n   \"payeeId\":\"pye_pgrbvdy1vy31z54n6m\",\n   \"reference\":\"RET - Deposit\",\n   \"amount\":\"100.12\",\n   \"currency\":\"GBP\",\n   \"paymentScheme\":\"FPS\",\n   \"reason\":\"3rd party payment\",\n   \"createdAt\":1677249715102,\n   \"updatedAt\":1677249715102\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: rtn_j82rl497g47g5ykvzn
                  memberId:
                    type: string
                    example: mbr_emv4j231821oaz56yx
                  status:
                    type: string
                    example: CREATED
                  paymentId:
                    type: string
                    example: pmt_xpn6le15nyk1v9jo4g
                  payeeId:
                    type: string
                    example: pye_pgrbvdy1vy31z54n6m
                  reference:
                    type: string
                    example: RET - Deposit
                  amount:
                    type: string
                    example: '100.12'
                  currency:
                    type: string
                    example: GBP
                  paymentScheme:
                    type: string
                    example: FPS
                  reason:
                    type: string
                    example: 3rd party payment
                  createdAt:
                    type: integer
                    example: 1677249715102
                    default: 0
                  updatedAt:
                    type: integer
                    example: 1677249715102
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Payment Returns
  /payment-returns/:
    get:
      summary: List Returns
      description: ''
      operationId: list-returns
      parameters:
      - name: amount(gte)
        in: query
        description: Greater than or equal to the return amount.
        schema:
          type: string
      - name: amount(lte)
        in: query
        description: Less than or equal to the return amount.
        schema:
          type: string
      - name: id
        in: query
        description: Id of the return. Multiple `id` params can be provided.
        schema:
          type: string
      - name: payeeId
        in: query
        description: Id of the Payee associated with a return. Multiple `payeeId` params can be provided.
        schema:
          type: string
      - name: paymentId
        in: query
        description: Id of the Payment associated with a return. Multiple `paymentId` params can be provided.
        schema:
          type: string
      - name: paymentScheme
        in: query
        description: Payment Scheme that was used to process the return.
        schema:
          type: string
          enum:
          - ''
      - name: search
        in: query
        description: Search by the Return Payment `id` , `reason` or `reference`
        schema:
          type: string
      - name: status
        in: query
        description: Status of the return. Multiple `status` params can be provided.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n   {\n   \"id\":\"rtn_j82rl497g47g5ykvzn\",\n   \"memberId\":\"mbr_emv4j231821oaz56yx\",\n   \"status\":\"COMPLETED\",\n   \"paymentId\":\"pmt_xpn6le15nyk1v9jo4g\",\n   \"payeeId\":\"pye_pgrbvdy1vy31z54n6m\",\n   \"reference\":\"RET - Deposit\",\n   \"amount\":\"100.12\",\n   \"currency\":\"GBP\",\n   \"paymentScheme\":\"FPS\",\n   \"reason\":\"3rd party payment\",\n   \"createdAt\":1677249715102,\n   \"updatedAt\":1637593856104\n\t \t},\n    {...},\n    {...}\n]\n\n"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request GET \\\n     --url https://sandbox.fiatrepublic.com/api/v1/payment-returns/ \\\n     --header 'Accept: application/json' \n     --header 'Authorization: Basic ZmlhdHJlcHVibGljOmZpYXRyZXB1YmxpYw==' \\"
        samples-languages:
        - curl
      tags:
      - Payment Returns
  /payment-returns/{id}:
    get:
      summary: Get Return
      description: ''
      operationId: get-return
      parameters:
      - name: id
        in: path
        description: Id of the Return.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n   \"id\":\"rtn_j82rl497g47g5ykvzn\",\n   \"memberId\":\"mbr_emv4j231821oaz56yx\",\n   \"status\":\"COMPLETED\",\n   \"paymentId\":\"pmt_xpn6le15nyk1v9jo4g\",\n   \"payeeId\":\"pye_pgrbvdy1vy31z54n6m\",\n   \"reference\":\"RET - Deposit\",\n   \"amount\":\"100.12\",\n   \"currency\":\"GBP\",\n   \"paymentScheme\":\"FPS\",\n   \"reason\":\"3rd party payment\",\n   \"createdAt\":1677249715102,\n   \"updatedAt\":1637593856104     \n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: rtn_j82rl497g47g5ykvzn
                  memberId:
                    type: string
                    example: mbr_emv4j231821oaz56yx
                  status:
                    type: string
                    example: COMPLETED
                  paymentId:
                    type: string
                    example: pmt_xpn6le15nyk1v9jo4g
                  payeeId:
                    type: string
                    example: pye_pgrbvdy1vy31z54n6m
                  reference:
                    type: string
                    example: RET - Deposit
                  amount:
                    type: string
                    example: '100.12'
                  currency:
                    type: string
                    example: GBP
                  paymentScheme:
                    type: string
                    example: FPS
                  reason:
                    type: string
                    example: 3rd party payment
                  createdAt:
                    type: integer
                    example: 1677249715102
                    default: 0
                  updatedAt:
                    type: integer
                    example: 1637593856104
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request GET \\\n     --url https://sandbox.fiatrepublic.com/api/v1/payment-returns/pmt_xpn6le15nyk1v9jo4g \\\n     --header 'Accept: application/json' \n     --header 'Authorization: Basic ZmlhdHJlcHVibGljOmZpYXRyZXB1YmxpYw==' \\"
        samples-languages:
        - curl
      tags:
      - Payment Returns
