openapi: 3.2.0
info:
  title: fiat-republic Emt Payee API
  version: '1.0'
servers:
- url: https://sandbox.fiatrepublic.com/api/v1
security:
- sec0: []
tags:
- name: Emt Payee
paths:
  /emt-payee:
    post:
      summary: Create EMT Payee
      description: ''
      operationId: create-emt-payee
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the EMT Payee.
                token:
                  type: string
                  description: ENEUR, ENGBP, ENUSD
                walletDetails:
                  type: object
                  properties:
                    token:
                      type: string
                      description: Name of the token for which this EMT Payee can be used
                    address:
                      type: string
                      description: Onchain address of the wallet for the given EMT Payee. Please note that the address will depend upon the Blockchain being used
                    blockchain:
                      type: string
                      default: ALGO
                additionalDetails:
                  type: string
                  description: Additional details for the EMT Payee which might be passed on creation.
                metadata:
                  type: string
                  description: Additional data in JSON key:value format.
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "    {\n        \"id\": \"epy_jalpeo0evbg7bkx39z\",\n        \"owner\": {\n            \"type\": \"MEMBER\",\n            \"id\": \"mbr_d8ovyep1r8x0kx65n2\"\n        },\n        \"name\": \"Norse Wallet CORP\",\n        \"status\": \"ACTIVE\",\n        \"token\": \"ENEUR\",\n        \"walletDetails\": {\n            \"token\": \"EEUR\",\n            \"address\": \"ZZZZZZZZYYYYYYYYYXXXXXXXXAAAAAAABBBBBBBBCCCCCCCC\",\n            \"blockchain\": \"ALGO\"\n        },\n        \"paymentSchemes\": [\n            \"EMT_EAGLE_NET\"\n        ],\n        \"additionalDetails\": null,\n        \"createdAt\": 1732200096929,\n        \"updatedAt\": 1742577988195,\n        \"metadata\": null\n    },"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Emt Payee
    get:
      summary: List EMT Payees
      description: ''
      operationId: list-emt-payees
      parameters:
      - name: id
        in: query
        description: Id of the EMT Payee
        schema:
          type: string
      - name: token
        in: query
        description: ENEUR, ENGBP, ENUSD
        schema:
          type: string
      - name: status
        in: query
        description: 'Status of the EMT Payee. Can be: ACTIVE, DELETED'
        schema:
          type: string
      - name: search
        in: query
        description: Search by the token, address or blockchain
        schema:
          type: string
      - name: createdAt(gte)
        in: query
        description: Greater than or equal to the created date. ISO 8601 Date format. e.g. 2021-11-18
        schema:
          type: string
          format: date
      - name: createdAt(lte)
        in: query
        description: Less than or equal to the created date. ISO 8601 Date format. e.g. 2021-11-18
        schema:
          type: string
          format: date
      - name: status(not)
        in: query
        description: Excludes provided EMT Payee status
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Emt Payee
  /emt-payee/{id}:
    get:
      summary: Get EMT Payee
      description: ''
      operationId: get-emt-payee
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"epy_jalpeo0evbg7bkx39zzzz\",\n    \"owner\": {\n        \"type\": \"MEMBER\",\n        \"id\": \"mbr_d8ovyep1r8x0kx65zz2\"\n    },\n    \"name\": \"Norse Wallet CORP \",\n    \"status\": \"ACTIVE\",\n    \"token\": \"ENEUR\",\n    \"walletDetails\": {\n        \"token\": \"EEUR\",\n        \"address\": \"XXXXXYYYYYYZZZZZZAAAAABBBBBBBBCCCCCCCCCCDDDDDDDDD\",\n        \"blockchain\": \"ALGO\"\n    },\n    \"paymentSchemes\": [\n        \"EMT_EAGLE_NET\"\n    ],\n    \"additionalDetails\": null,\n    \"createdAt\": 1732200096929,\n    \"updatedAt\": 1742577988195,\n    \"metadata\": null\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: epy_jalpeo0evbg7bkx39zzzz
                  owner:
                    type: object
                    properties:
                      type:
                        type: string
                        example: MEMBER
                      id:
                        type: string
                        example: mbr_d8ovyep1r8x0kx65zz2
                  name:
                    type: string
                    example: 'Norse Wallet CORP '
                  status:
                    type: string
                    example: ACTIVE
                  token:
                    type: string
                    example: ENEUR
                  walletDetails:
                    type: object
                    properties:
                      token:
                        type: string
                        example: EEUR
                      address:
                        type: string
                        example: XXXXXYYYYYYZZZZZZAAAAABBBBBBBBCCCCCCCCCCDDDDDDDDD
                      blockchain:
                        type: string
                        example: ALGO
                  paymentSchemes:
                    type: array
                    items:
                      type: string
                      example: EMT_EAGLE_NET
                  additionalDetails: {}
                  createdAt:
                    type: integer
                    example: 1732200096929
                    default: 0
                  updatedAt:
                    type: integer
                    example: 1742577988195
                    default: 0
                  metadata: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Invalid Identifier:
                  value: "{\n    \"errorCode\": \"INVALID_REQUEST_DATA\",\n    \"message\": \"'epy_jalpeo0evbg7bkx39' is not a valid identifier.\"\n}"
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                    example: INVALID_REQUEST_DATA
                  message:
                    type: string
                    example: '''epy_jalpeo0evbg7bkx39'' is not a valid identifier.'
      deprecated: false
      tags:
      - Emt Payee
    delete:
      summary: Delete EMT Payee
      description: ''
      operationId: delete-emt-payee
      parameters:
      - name: id
        in: path
        description: Id of the EMT Payee
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Emt Payee
