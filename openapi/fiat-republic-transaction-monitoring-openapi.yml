openapi: 3.1.0
info:
  title: transaction-monitoring
  version: '1.0'
servers:
- url: https://sandbox-oxygen.fiatrepublic.com/api/v1
security:
- sec0: []
x-readme-fauxas: true
paths:
  /alerts:
    get:
      summary: List Alerts
      description: ''
      operationId: oxygen-list-alerts
      parameters:
      - name: status
        in: query
        description: Current status of the alert
        schema:
          type: string
          enum:
          - CREATED
          - UNDER_REVIEW
          - ESCALATED
          - REPORTED
          - RESOLVED
      - name: id
        in: query
        description: Alert id
        schema:
          type: string
      - name: ruleId
        in: query
        description: Id of the rule which triggered the alert
        schema:
          type: string
      - name: entityId
        in: query
        description: Id of the Entity within Oxygen
        schema:
          type: string
      - name: investigationId
        in: query
        description: Unique identifier of the Investigation
        schema:
          type: string
      - name: createdAt(gte)
        in: query
        description: Date of alert creation within the system
        schema:
          type: string
          format: date
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /alerts/{id}:
    get:
      summary: Get Alert
      description: ''
      operationId: oxygen-get-alert
      parameters:
      - name: id
        in: path
        description: Unique identifier of the alert
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /entities:
    get:
      summary: List Entities
      description: ''
      operationId: oxygen-list-entities
      parameters:
      - name: id
        in: query
        description: Id of the entity within Oxygen
        schema:
          type: string
      - name: externalId
        in: query
        description: Id of the entity within Member's system
        schema:
          type: string
      - name: name
        in: query
        description: Name, surname, company name, trading name
        schema:
          type: string
      - name: country
        in: query
        description: Country provided for the company or individual address
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /entities/{id}:
    get:
      summary: Get Entity
      description: ''
      operationId: oxygen-get-entity
      parameters:
      - name: entityId
        in: path
        description: Id of the entity based on the Member's system
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /events/entities:
    post:
      summary: Create Entity
      description: 'The endpoint is designed to handle two types of entities: individual and business. This means that when using the API, the user will need to select proper type of entity and provide the appropriate payload information accordingly.'
      operationId: oxygen-create-entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - externalId
              - type
              - externalUpdatedAt
              - externalCreatedAt
              properties:
                externalId:
                  type: string
                  description: Entity id provided by the Member
                type:
                  type: string
                  description: Entity type which can be either individual (PERSON) or company (BUSINESS)
                  enum:
                  - PERSON
                  - BUSINESS
                externalUpdatedAt:
                  type: integer
                  description: Date of the entity's data update
                  format: int32
                externalCreatedAt:
                  type: integer
                  description: Date of entity creation within Member's system
                  format: int32
                riskRating:
                  type: string
                  description: User risk level provided by the Member
                  enum:
                  - LOW
                  - MEDIUM
                  - HIGH
                externalStatus:
                  type: string
                  description: Status of the user within Members system, e.g. ACTIVE, BLOCKED, CREATED, OFFBOARDED
                externalType:
                  type: string
                  description: Type of the entity within Member's system, e.g. PAYEE, PAYER
                metadata:
                  type: array
                  description: Additional data
                  items:
                    type: string
                email:
                  type: string
                  description: Email of the Individual Entity / Business
                phone:
                  type: string
                  description: Phone number of the Individual Entity / Business including country prefix. e.g. +447788661100
                paymentChannelExternalIds:
                  type: string
                  description: Id of the payment channel card or bank account within the Member's system related with the particular entity
                firstName:
                  type: string
                  description: 'FOR INDIVIDUAL: First Name of the Individual Entity.'
                  default: Individual Entity
                middleName:
                  type: string
                  description: 'FOR INDIVIDUAL: Middle Name of the Individual Entity.'
                lastName:
                  type: string
                  description: 'FOR INDIVIDUAL: Last Name of the Individual Entity.'
                address:
                  type: object
                  description: 'FOR INDIVIDUAL: Home Address of the Individual Entity'
                  required:
                  - line1
                  - city
                  - postalCode
                  - country
                  properties:
                    line1:
                      type: string
                    line2:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    postalCode:
                      type: string
                    country:
                      type: string
                      description: Two-letter ISO 3166-1 alpha-2 country code e.g. GB for United Kingdom
                birthCountry:
                  type: string
                  description: 'FOR INDIVIDUAL: Two-letter ISO 3166-1 alpha-2 country code e.g. GB for United Kingdom.'
                nationality:
                  type: string
                  description: 'FOR INDIVIDUAL: Two-letter ISO 3166-1 alpha-2 country code e.g. GB for United Kingdom. One of more nationalities can be provided.'
                dob:
                  type: string
                  description: 'FOR INDIVIDUAL: Date of birth of the user'
                  format: date
                pep:
                  type: boolean
                  description: 'FOR INDIVIDUAL: Confirmation if the individual is Politically Exposed Person (PEP)'
                companyName:
                  type: string
                  description: 'FOR BUSINESS: Name of the Business Entity'
                tradingName:
                  type: string
                  description: 'FOR BUSINESS: Trading Name of the Business Entity'
                registrationNumber:
                  type: string
                  description: 'FOR BUSINESS: Registration number provided within the official registry for the specific jurisdiction'
                registrationDate:
                  type: string
                  description: 'FOR BUSINESS: Date of the registration of the company'
                  format: date
                registeredAddress:
                  type: object
                  description: 'FOR BUSINESS: Under under which the company has been registered'
                  required:
                  - line1
                  - city
                  - postalCode
                  - country
                  properties:
                    line1:
                      type: string
                    line2:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    postalCode:
                      type: string
                    country:
                      type: string
                      description: Two-letter ISO 3166-1 alpha-2 country code e.g. GB for United Kingdom
                tradingAddress:
                  type: object
                  description: 'FOR BUSINESS: Address under which company operates (can be different than registration address)'
                  required:
                  - line1
                  - city
                  - postalCode
                  - country
                  properties:
                    line1:
                      type: string
                    line2:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    postalCode:
                      type: string
                    country:
                      type: string
                      description: Two-letter ISO 3166-1 alpha-2 country code e.g. GB for United Kingdom
                website:
                  type: string
                  description: 'FOR BUSINESS: Website of the Business Entity'
                businessType:
                  type: string
                  description: 'FOR BUSINESS: Legal form of the Business Entity, e.g: LLC, PLC, SOLETRADER, CHARITY'
                businessPersons:
                  type: object
                  description: 'FOR BUSINESS: Contact person within the Business Entity'
                  required:
                  - firstName
                  - lastName
                  properties:
                    firstName:
                      type: string
                      description: First Name of the Business Person
                    middleName:
                      type: string
                      description: Middle Name of the Business Person
                    lastName:
                      type: string
                      description: Last Name of the Business Person
                    address:
                      type: object
                      required:
                      - line1
                      - city
                      - postalCode
                      - country
                      properties:
                        line1:
                          type: string
                        line2:
                          type: string
                        city:
                          type: string
                        state:
                          type: string
                        postalCode:
                          type: string
                        country:
                          type: string
                          description: Two-letter ISO 3166-1 alpha-2 country code e.g. GB for United Kingdom
                    email:
                      type: string
                      description: Email of the Business Person
                    phone:
                      type: string
                      description: Phone number of the Individual including country prefix. e.g. `+447788661100`
                    birthCountry:
                      type: string
                      description: Two-letter [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code e.g. `GB` for United Kingdom
                    nationality:
                      type: string
                      description: Two-letter [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code e.g. `GB` for United Kingdom
                    dob:
                      type: string
                      description: Date of Birth of the Individual in `YYYY-MM-DD` format. e.g. `1975-04-05`
                      format: date
                    type:
                      type: string
                    pep:
                      type: boolean
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /events/payment-channels:
    post:
      summary: Create Payment Channel
      description: 'The provided payload applies to two different payment channels: card and bank account. This means that the API user will have to choose one of these channels to process their payment transaction. It is important to understand that the payload for each channel is different and needs to be used correctly to ensure that the payment is processed successfully.'
      operationId: oxygen-create-payment-channel
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - externalId
              properties:
                type:
                  type: string
                  description: 'Type of the payment channel: BANK_ACCOUNT'
                  enum:
                  - BANK_ACCOUNT
                externalId:
                  type: string
                  description: Id of the bank account (payment channel) within the Member's system
                externalCreatedAt:
                  type: integer
                  description: Date of payment channel creation within Member's system
                  format: int32
                externalUpdatedAt:
                  type: integer
                  description: Date of the payment channel's update
                  format: int32
                metadata:
                  type: array
                  description: Additional data
                  items:
                    type: string
                country:
                  type: string
                  description: 'Country code: Two-letter ISO 3166-1 alpha-2 country code e.g. GB for United Kingdom,'
                externalStatus:
                  type: string
                  description: 'For BANK ACCOUNT: Status of the payment channel within Member''s system e.g. ACTIVE, BLOCKED'
                bankName:
                  type: string
                  description: 'For BANK_ACCOUNT: Name of the bank under which the account has been created'
                accountHolderName:
                  type: string
                  description: 'For BANK_ACCOUNT: Full name of the account holder'
                iban:
                  type: string
                  description: 'For BANK_ACCOUNT: IBAN associated with the account'
                bic:
                  type: string
                  description: 'For BANK_ACCOUNT: SWIFT BIC associated with the account'
                accountNumber:
                  type: string
                  description: 'For BANK_ACCOUNT: Account Number associated with the account. Depending on the currency and country, account will typically have at least an IBAN or an accountNumber.'
                routingCodes:
                  type: string
                  description: 'For BANK_ACCOUNT: One or more routing codes associated with the account. Typically used in conjunction with the account number.'
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /events/transactions:
    post:
      summary: Create Transaction
      description: ''
      operationId: create-transaction
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                externalId:
                  type: string
                externalStatus:
                  type: string
                amount:
                  type: string
                currency:
                  type: string
                reference:
                  type: string
                sender:
                  type: object
                  properties:
                    externalEntityId:
                      type: string
                      description: Entity ID provided by the Member
                    externalPaymentChannelId:
                      type: string
                      description: Id of the payment channel provided by the Member
                recipient:
                  type: object
                  properties:
                    externalEntityId:
                      type: string
                    externalPaymentChannelId:
                      type: string
                    countryCode:
                      type: string
                paymentScheme:
                  type: string
                externalCreatedAt:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "    {\n        \"eventId\": \"5609c570-3b45-4bec-a326-9d50ee465156\",\n        \"externalId\": \"pmt_eaxp4n74enj0lvvvvv\",\n        \"externalStatus\": null,\n        \"reference\": \"Custom reference here\",\n        \"amount\": \"2501.00\",\n        \"currency\": \"EUR\",\n        \"baseAmount\": \"2501.00\",\n        \"paymentScheme\": \"SCT\",\n        \"sender\": {\n            \"externalEntityId\": \"pyr_xz3l6d7b4k631aaaaa\",\n            \"externalPaymentChannelId\": \"pyr_xz3l6d7b4k6zzzzz\",\n            \"countryCode\": \"BE\"\n        },\n        \"recipient\": {\n            \"externalEntityId\": \"eus_v8jkx67no9g0daaaaa\",\n            \"externalPaymentChannelId\": \"vac_ong3zm73oela7zzzzz\",\n            \"countryCode\": \"DK\"\n        },\n        \"externalCreatedAt\": 1748432324513,\n        \"receivedAt\": 1748432324728\n    },"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
    get:
      summary: List Transactions
      description: ''
      operationId: oxygen-list-transactions
      parameters:
      - name: eventId
        in: query
        description: Id of the transaction within Oxygen
        schema:
          type: string
      - name: externalId
        in: query
        description: Id of the transaction provided by the Member
        schema:
          type: string
      - name: entityExternalId
        in: query
        description: Entity id provided by the Member
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /investigations:
    post:
      summary: Create Investigations
      description: ''
      operationId: oxygen-create-investigations
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entityId:
                  type: string
                  description: Unique identifier of the entity
                note:
                  type: object
                  description: Description of the findings and checks based on the review performed on the client profile
                  properties:
                    content:
                      type: string
                      description: description of the findings and checks based on the review performed on the client profile
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
    get:
      summary: List Investigations
      description: ''
      operationId: oxygen-list-investigations
      parameters:
      - name: entityId
        in: query
        description: Unique identifier of the entity
        schema:
          type: string
      - name: status
        in: query
        description: Status of the Investigation
        schema:
          type: string
          enum:
          - RESOLVED
          - ESCALATED
          - REPORTED
          - AWAITING INFORMATION
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /investigations/{id}:
    get:
      summary: Get Investigation
      description: ''
      operationId: oxygen-get-investigation
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Investigation
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
    patch:
      summary: Update Investigation
      description: ''
      operationId: oxygen-update-investigation
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Investigation
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: Status of the Investigation
                  enum:
                  - RESOLVED
                  - ESCALATED
                  - REPORTED
                  - AWAITING INFORMATION
                statusReason:
                  type: string
                  description: 'Reason of the status: e.g. FALSE POSITIVE (reason) for status RESOLVED'
                assignedToId:
                  type: string
                  description: Id of the platform user who is assigned to the Investigation
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /payment-channels:
    get:
      summary: List Payment Channel
      description: ''
      operationId: oxygen-list-payment-channel
      parameters:
      - name: entityExternalId
        in: query
        description: Id of the entity to which the payment channel belongs provided by the Member
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /payment-channels/{id}:
    get:
      summary: Get Payment Channel
      description: ''
      operationId: oxygen-get-one-payment-channel
      parameters:
      - name: id
        in: path
        description: Id of the Payment Channel
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /platform-users:
    get:
      summary: List Platform Users
      description: ''
      operationId: oxygen-list-platform-users
      parameters:
      - name: id
        in: query
        description: Platform user id
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /platform-users/{entityId}:
    get:
      summary: Get Platform User
      description: ''
      operationId: oxygen-get-platform-user
      parameters:
      - name: Id
        in: path
        description: Platform user ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /rules:
    post:
      summary: Create Rule
      description: ''
      operationId: oxygen-create-rule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Rule Name
                definition:
                  type: object
                  description: '[IMPORTANT] In one request you can create only one rule'
                  properties:
                    Activity on dormant account:
                      type: object
                      required:
                      - template
                      - cumulativeTimePeriod
                      - cumulativeAmountThreshold
                      - timePeriod
                      properties:
                        template:
                          type: string
                          enum:
                          - ActivityOnDormantAccount
                        cumulativeTimePeriod:
                          type: string
                          description: Specify period of transactions to monitor since the dormancy
                          enum:
                          - 4h
                          - 8h
                          - 12h
                          - 1d
                          - 2d
                          - 7d
                          - 14d
                          - 30d
                          - 45d
                          - 60d
                          - 90d
                        cumulativeAmountThreshold:
                          type: string
                          description: Minimum threshold which should trigger the alert
                        timePeriod:
                          type: string
                          description: Specify dormancy period
                          enum:
                          - 4h
                          - 8h
                          - 12h
                          - 1d
                          - 2d
                          - 7d
                          - 14d
                          - 30d
                          - 45d
                          - 60d
                          - 90d
                        entityRisk:
                          type: string
                          description: Specify for which risk level you want to implement this rule, if for all you can leave this field empty
                          enum:
                          - LOW
                          - MEDIUM
                          - HIGH
                        age:
                          type: object
                          properties:
                            condition:
                              type: string
                              enum:
                              - ABOVE
                              - BELOW
                            value:
                              type: integer
                              format: int32
                        entityType:
                          type: string
                          enum:
                          - INDIVIDUAL
                          - BUSINESS
                        entityExternalTypes:
                          type: array
                          description: '["END_USER", "USER", "CLIENT"]'
                          items:
                            type: string
                    Cumulative transaction amount:
                      type: object
                      required:
                      - template
                      - amountThreshold
                      - timePeriod
                      properties:
                        template:
                          type: string
                          enum:
                          - CumulativeTransactionAmount
                        amountThreshold:
                          type: string
                          description: Threshold of the transaction which should trigger the alert (equal or more)
                        timePeriod:
                          type: string
                          description: Specify time period for transactions
                          enum:
                          - 4h
                          - 8h
                          - 12h
                          - 1d
                          - 2d
                          - 7d
                          - 14d
                          - 30d
                          - 45d
                          - 60d
                          - 90d
                        entityRisk:
