paths:
  /payers:
    get:
      summary: List Payers
      description: ''
      operationId: list-payers
      parameters:
      - name: endUserId
        in: query
        description: Id of the End User whose Payers you want to list.<br>If not set, all Payers for the Member and End Users will be listed.
        schema:
          type: string
      - name: id
        in: query
        description: One of more Payer id's. Multiple `id` params can be provided.
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
      - name: owner.type
        in: query
        schema:
          type: string
          enum:
          - MEMBER
          - END_USER
      - name: type
        in: query
        schema:
          type: string
          enum:
          - PERSON
          - BUSINESS
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"id\": \"pyr_8xpn6le15nk1v9jo4g\",\n    \"owner\": {\n        \"type\": \"END_USER\",\n        \"id\": \"eus_ov8jkx67ny1dbglamy\"\n    },\n    \"type\": \"PERSON\",\n    \"name\": \"Satoshi Nakamoto\",\n    \"bankDetails\": {\n        \"iban\": \"GB41BARC20038477799771\"\n    },\n    \"additionalDetails\": {},\n    \"createdAt\": 1638882562371,\n    \"updatedAt\": 1638882562371,\n    \"metadata\": null\n\t},\n    {...},\n    {...}\n]"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
