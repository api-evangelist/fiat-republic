    patch:
      summary: Update Business End User
      description: ''
      operationId: update-business-end-user
      parameters:
      - name: id
        in: path
        description: ID of Business End User that needs to be updated
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                business:
                  type: object
                  properties:
                    companyName:
                      type: string
                    tradingName:
                      type: string
                    type:
                      type: string
                      enum:
                      - LIMITED
                    registrationNumber:
                      type: string
                    registrationDate:
                      type: string
                      format: date
                    registeredAddress:
                      type: object
                      required:
                      - line 1
                      - city
                      - postal code
                      - country
                      properties:
                        line 1:
                          type: string
                          description: First line of the company registration address
                        line 2:
                          type: string
                          description: Second line of the company registration address
                        city:
                          type: string
                          description: City of the registration address
                        state:
                          type: string
                          description: Required for USD
                        postal code:
