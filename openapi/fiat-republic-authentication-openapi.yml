openapi: 3.1.0
info:
  title: fiat-republic-authentication
  version: '1.0'
servers:
- url: https://sandbox.fiatrepublic.com/passport
security:
- sec0: []
x-readme-fauxas: true
paths:
  /oauth/token:
    post:
      summary: Create API Token
      description: ''
      operationId: create-api-token
      parameters:
      - name: Accept
        in: header
        description: application/json
        schema:
          type: string
      - name: Content-Type
        in: header
        description: x-www-form-urlencoded
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - grant_type
              - client_id
              - client_secret
              - scope
              properties:
                grant_type:
                  type: string
                  default: client_credentials
                client_id:
                  type: string
                client_secret:
                  type: string
                scope:
                  type: string
                  description: Is case sensitive. Use uppercase
                  enum:
                  - PAYMENTS
                  - OXYGEN
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n   \"access_token\": \"eyJ0eXAiOiJKV1QiLCJhbGciOiJI...\",\n   \"token_type\": \"bearer\",\n   \"expires_in\": 3599\n}"
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJ0eXAiOiJKV1QiLCJhbGciOiJI...
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 3599
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{"error":"invalid_client"}'
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_client
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: 'curl --location ''https://sandbox.fiatrepublic.com/passport/oauth/token'' \

            --header ''Accept: application/json'' \

            --header ''Content-Type: application/x-www-form-urlencoded'' \

            --data-urlencode ''grant_type=client_credentials'' \

            --data-urlencode ''scope=PAYMENTS'' \

            --data-urlencode ''client_id=your_client_id'' \

            --data-urlencode ''client_secret=your_client_secret'''
        samples-languages:
        - curl
