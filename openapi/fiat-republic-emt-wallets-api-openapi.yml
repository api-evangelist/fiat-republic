  /emt-wallets/{id}:
    get:
      summary: Get EMT Wallet
      description: ''
      operationId: get-emt-wallet
      parameters:
      - name: id
        in: path
        description: Id of EMT wallet
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "    {\n        \"id\": \"wlt_jl2vpn1mmm315rxko6\",\n        \"businessId\": \"biz_mv4j2318blb1oaz56y\",\n        \"owner\": {\n            \"type\": \"MEMBER\",\n            \"id\": \"mbr_d8ovyep1r8x0kx65n2\"\n        },\n        \"status\": \"ACTIVE\",\n        \"label\": \"Corporate 5\",\n        \"tags\": [\n            \"CORPORATE\"\n        ],\n        \"token\": \"ENGBP\",\n        \"walletDetails\": {\n            \"token\": \"EGBP\",\n            \"address\": \"111111222222AAAAAAZZZZZZXXXXXXCCCCCCCCCCYYYYYYYYYYGGGGGGGGG\",\n            \"blockchain\": \"ALGO\"\n        },\n        \"balance\": {\n            \"actual\": \"171.00\",\n            \"available\": \"171.00\",\n            \"reserved\": \"0.00\"\n        },\n        \"createdAt\": 1734097298926,\n        \"updatedAt\": 1742805302493,\n        \"metadata\": null\n    },"
