security:
- sec0: []
tags:
- name: Emt Wallets
paths:
  /emt-wallets:
    get:
      summary: List EMT Wallets
      description: ''
      operationId: list-emt-wallets
      parameters:
      - name: createdAt(gte)
        in: query
        description: Greater than or equal to the created date. [ISO 8601 Date](https://en.wikipedia.org/wiki/ISO_8601) format. e.g. `2021-11-18`
        schema:
          type: string
          format: date
      - name: createdAt(lte)
        in: query
        description: Less than or equal to the created date. [ISO 8601 Date](https://en.wikipedia.org/wiki/ISO_8601) format. e.g. `2021-11-18`
        schema:
          type: string
          format: date
      - name: status
        in: query
        description: Status of the EMT Wallet
        schema:
          type: string
          enum:
          - CREATED
          - ACTIVE
          - BLOCKED
          - CLOSED
      - name: tags
        in: query
        description: CORPORATE, CLIENT_MONEY
        schema:
          type: array
          items:
            type: string
      - name: token
        in: query
        description: ENGBP, ENEUR, ENUSD
        schema:
          type: string
      - name: search
        in: query
        description: Search by the token, address or blockchain
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
