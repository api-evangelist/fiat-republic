            schema:
              type: object
              properties:
                label:
                  type: string
                  description: An optional label to easily identify the account on the Dashboard.
                metadata:
                  type: array
                  items:
                    type: string
                status:
                  type: string
                  description: Block/Unblock a virtual account temporarily or Close it permanently by updating its' status.
                  enum:
                  - BLOCKED
