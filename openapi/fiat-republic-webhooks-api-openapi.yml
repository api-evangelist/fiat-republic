              - events
              - url
              properties:
                description:
                  type: string
                  description: Optional description for the Webhook.
                events:
                  type: array
                  description: '[Events](https://docs.fiatrepublic.com/docs/webhooks) that you want to receive on the provided URL.'
                  items:
                    type: string
                metadata:
                  type: array
                  items:
                    type: string
                status:
                  type: string
                  description: Defaults to `ENABLED` if not set.
                  enum:
                  - ENABLED
                  - DISABLED
                url:
                  type: string
                  description: URL on which you want to receive the events.
