                  value: "{\n    \"id\": \"whk_ejl2vpn1m305rxko6b\",\n    \"url\": \"https://webhook.site/0da05c1a-6978-4178-bee9-1cabb582ac3f\",\n    \"events\": [\n        \"INDIVIDUAL_END_USER.CREATED\",\n        \"PAYMENT.CREATED\",\n        \"FIAT_ACCOUNT.CREATED\",\n        \"FIAT_ACCOUNT.UPDATED\",\n        \"FIAT_ACCOUNT.STATUS_UPDATED\",\n        \"INDIVIDUAL_END_USER.STATUS_UPDATED\",\n        \"PAYMENT.STATUS_UPDATED\"\n    ],\n    \"status\": \"ENABLED\",\n    \"description\": \"Fiat Republic Webhooks\",\n    \"createdAt\": 1637601761317,\n    \"updatedAt\": 1637601761317,\n    \"metadata\": null\n}"
