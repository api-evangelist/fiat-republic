paths:
  /emt-payers:
    get:
      summary: List EMT Payers
      description: ''
      operationId: list-emt-payers
      parameters:
      - name: id
        in: query
        description: Unique identifier of EMT Payer
        schema:
          type: string
      - name: search
        in: query
        description: ENGBP
        schema:
          type: string
      - name: createdAt(gte)
        in: query
        description: Greater than or equal to the created date. [ISO 8601 Date](https://en.wikipedia.org/wiki/ISO_8601) format. e.g. `2021-11-18`
        schema:
          type: string
          format: date
      - name: createdAt(lte)
        in: query
        description: Less than or equal to the created date. [ISO 8601 Date](https://en.wikipedia.org/wiki/ISO_8601) format. e.g. `2021-11-18`
        schema:
          type: string
          format: date
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n    {\n        \"id\": \"epr_4dbv6l1zlz57y3ormg\",\n        \"owner\": {\n            \"type\": \"MEMBER\",\n            \"id\": \"mbr_d8ovyep1r8x0kx65n2\"\n        },\n        \"name\": \"Fiat Republic Payer\",\n        \"walletDetails\": {\n            \"token\": \"EGBP\",\n            \"address\": \"111111222222AAAAAAZZZZZZXXXXXXCCCCCCCCCCYYYYYYYYYYGGGGGGGGG\",\n            \"blockchain\": \"ALGO\"\n        },\n        \"additionalDetails\": null,\n        \"createdAt\": 1742805302481,\n        \"updatedAt\": 1742805302481,\n        \"metadata\": null\n    }\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: epr_4dbv6l1zlz57y3ormg
                    owner:
                      type: object
                      properties:
                        type:
                          type: string
                          example: MEMBER
                        id:
                          type: string
                          example: mbr_d8ovyep1r8x0kx65n2
                    name:
                      type: string
                      example: Fiat Republic Payer
                    walletDetails:
                      type: object
                      properties:
                        token:
                          type: string
                          example: EGBP
                        address:
                          type: string
                          example: 111111222222AAAAAAZZZZZZXXXXXXCCCCCCCCCCYYYYYYYYYYGGGGGGGGG
                        blockchain:
                          type: string
                          example: ALGO
                    additionalDetails: {}
                    createdAt:
                      type: integer
                      example: 1742805302481
                      default: 0
                    updatedAt:
                      type: integer
                      example: 1742805302481
                      default: 0
                    metadata: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Emt Payers
  /emt-payers/{id}:
    get:
      summary: Get EMT Payer
      description: ''
      operationId: get-emt-payer
      parameters:
      - name: id
        in: path
        description: Id of EMT Payer
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"epr_4dbv6l1zlz57y3ormg\",\n    \"owner\": {\n        \"type\": \"MEMBER\",\n        \"id\": \"mbr_d8ovyep1r8x0kx65n2\"\n    },\n    \"name\": \"OnlyBulls\",\n    \"walletDetails\": {\n        \"token\": \"EGBP\",\n        \"address\": \"R3BHOIKT2EPWJSVDBBE65FIPXXZHWAY6B5ZFW37LOTSXMGGEUHTPBKEVIU\",\n        \"blockchain\": \"ALGO\"\n    },\n    \"additionalDetails\": null,\n    \"createdAt\": 1742805302481,\n    \"updatedAt\": 1742805302481,\n    \"metadata\": null\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: epr_4dbv6l1zlz57y3ormg
                  owner:
                    type: object
                    properties:
                      type:
                        type: string
                        example: MEMBER
                      id:
                        type: string
                        example: mbr_d8ovyep1r8x0kx65n2
                  name:
                    type: string
                    example: OnlyBulls
                  walletDetails:
                    type: object
                    properties:
                      token:
                        type: string
                        example: EGBP
                      address:
                        type: string
                        example: R3BHOIKT2EPWJSVDBBE65FIPXXZHWAY6B5ZFW37LOTSXMGGEUHTPBKEVIU
                      blockchain:
                        type: string
                        example: ALGO
                  additionalDetails: {}
                  createdAt:
                    type: integer
                    example: 1742805302481
                    default: 0
                  updatedAt:
                    type: integer
                    example: 1742805302481
                    default: 0
                  metadata: {}
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errorCode\": \"RESOURCE_MISSING\",\n    \"message\": \"No emt payer found with id epr_v8jkx67ndar1dbgggglam.\"\n}"
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                    example: RESOURCE_MISSING
                  message:
                    type: string
                    example: No emt payer found with id epr_v8jkx67ndar1dbgggglam.
      deprecated: false
      tags:
      - Emt Payers
