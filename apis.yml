aid: fiat-republic

name: Fiat Republic

description: Fiat Republic is a UK- and EU-regulated Banking-as-a-Service provider that gives crypto platforms, exchanges and stablecoin issuers
  a single API and single liability contract for local fiat rails. Its RESTful API automates end-user onboarding with embedded KYC/AML, named
  and virtual fiat accounts, pay-ins and payouts across GBP (Faster Payments / CHAPS), EUR (SEPA / SEPA Instant) and USD schemes, FX conversion,
  Verification of Payee (VoP), returns and recalls, and its Oxygen transaction-monitoring product. Access is via OAuth 2.0 client-credentials
  with PAYMENTS and OXYGEN scopes, HMAC-SHA256-signed webhooks using the HTTP Message Signatures standard, idempotency keys, and separate sandbox
  and production environments. Fiat Republic operates as an Electronic Money Institution regulated by the FCA (UK) and De Nederlandsche Bank (NL),
  with MSB registrations in the US and Canada.

