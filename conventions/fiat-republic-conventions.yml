idempotency:
  supported: true
  header: Idempotency-Key
  key_format: UUID (v4 recommended)
  scope: mutating requests (e.g. create payment)
  retention: >-
    No validity period for reuse with matching parameters — the same key with an identical payload
    always returns the original object rather than creating a new one.
  conflict_behavior: >-
    Reusing a key with a different payload returns HTTP 409 Conflict, e.g. "Payment with given
    idempotency key was already created with different payload".
  docs: https://docs.fiatrepublic.com/docs/idempotency
