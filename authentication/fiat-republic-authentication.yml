notes: >-
  OAuth 2.0 client-credentials flow. Client id/secret are generated in the Developers section of
  the Dashboard; the secret is shown once and cannot be retrieved afterward. A separate PAYMENTS
  vs OXYGEN scope selects which product surface the access token can reach (PAYMENTS expands to
  "PAYMENTS payments.*"). No HMAC/request signing on API calls; webhooks are separately signed
  with HMAC-SHA256 (see conventions/ and asyncapi/).
